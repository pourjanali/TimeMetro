<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>صفحه پیدا نشد | برنامه مترو تبریز</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f3f4f6; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; text-align: center; }
        main { max-width: 34rem; padding: 2rem; }
        h1 { font-size: 2rem; margin: 0 0 1rem; }
        p { color: #d1d5db; line-height: 1.9; }
        a { display: inline-block; margin-top: 1rem; border-radius: .75rem; background: #2563eb; color: #fff; padding: .75rem 1.25rem; text-decoration: none; }
        a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p aria-hidden="true" style="font-size:3rem;margin:0">🚇</p>
        <h1>این صفحه پیدا نشد</h1>
        <p>آدرس واردشده وجود ندارد. برای مشاهده جدول زمان‌بندی مترو تبریز به صفحه اصلی برگردید.</p>
        <a href="/">بازگشت به برنامه مترو تبریز</a>
    </main>
</body>
</html>
